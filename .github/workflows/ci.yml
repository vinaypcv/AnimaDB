name: AnimaDB Engine Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Native Ingress & Security Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Compilers & Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang python3 bc

    - name: Install Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check Formatting
      run: cargo fmt --check

    - name: Run Clippy Linter
      run: cargo clippy --release -- -D warnings

    - name: Build Engine (Release Profile)
      run: cargo build --release

    - name: Run Tests
      run: cargo test --release
